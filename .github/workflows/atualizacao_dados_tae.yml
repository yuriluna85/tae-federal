name: Atualizacao Diaria de Dados TAE (Noticias e Concursos)

on:
  schedule:
    - cron: '0 8 * * *' # Executa diariamente as 08:00 UTC (05:00 Horario de Brasilia)
  workflow_dispatch: # Permite disparo manual

jobs:
  mineracao-autonoma:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias do Scrapling
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requisitos_scraper.txt

      - name: Minerar Concursos TAEs e IFES (Scrapling)
        run: python scripts/minerador_concursos_tae.py

      - name: Minerar Noticias do Servidorismo TAE (RSS Livre)
        run: python scripts/atualizar_noticias_tae.py

      - name: Sincronizar e Enviar Atualizacoes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/concursos_tae.json noticias.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualizacao autonoma de noticias e concursos TAEs via Scrapling"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nenhuma alteracao nos dados para commitar."
          fi
