name: Atualizar Radar de Concursos TAE

on:
  schedule:
    - cron: '0 9 * * *' # Executa diariamente as 09:00 UTC (06:00 Brasilia)
  workflow_dispatch: # Permite disparo manual

jobs:
  mineracao-concursos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias do Scrapling
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requisitos_scraper.txt

      - name: Executar minerador de concursos com Scrapling
        run: python scripts/minerador_concursos_tae.py

      - name: Commitar e enviar atualizacao de dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/concursos_tae.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar base de concursos TAEs via Scrapling" && git push)
